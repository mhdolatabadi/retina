name: Test
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Validate Grafana Compose
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-only
        run: docker compose -f compose.grafana.yml config --quiet
